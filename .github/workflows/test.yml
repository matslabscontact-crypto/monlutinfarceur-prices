name: Test Chromium des prix publics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Lire les pages publiques dans Chromium
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          import subprocess, json
          asins=['B01N074ELB','B076ZR13BJ','B07HDGLR6N','B0FP1YYNP9']
          valid=0
          with sync_playwright() as p:
              browser=p.chromium.launch()
              context=browser.new_context(locale='fr-FR')
              page=context.new_page()
              for asin in asins:
                  try:
                      response=page.goto('https://www.amazon.fr/dp/'+asin,wait_until='domcontentloaded',timeout=30000)
                      try: page.wait_for_load_state('networkidle',timeout=5000)
                      except Exception: pass
                      print(asin,'HTTP',response.status,'titre',page.title())
                      parsed=subprocess.run(['php','parse-public-cli.php',asin],input=page.content().encode(),capture_output=True,timeout=20)
                      if parsed.returncode:
                          print('ECHEC',parsed.stderr.decode('utf8','replace')[:600])
                      else:
                          print('PRIX VALIDE',json.loads(parsed.stdout)['display'])
                          valid+=1
                  except Exception as e: print(asin,'ECHEC',str(e)[:300])
              browser.close()
          print(str(valid)+'/4 offres validees')
          raise SystemExit(0 if valid==4 else 1)
          PY
